settings:
  # Настройки дневного лимита продаж
  daily-limits:
    enabled: true
    default-max-amount: 50000.0 # Лимит заработка в день по умолчанию ($)
    reset-hour: 0 # Час автосброса лимита в сутки (от 0 до 23)

  # Настройки персональной динамической экономики
  dynamic-prices:
    enabled: true
    reset-interval-hours: 3 # Интервал полного сброса цен на 100% (в часах)
    drop-per-item: 0.0005 # Падение курса за 1 проданный предмет (0.0005 = 0.05%)

  # Множители цены скупки по пермишенам (Донат-бустеры)
  multipliers:
    "ngvkseller.multiplier.vip": 1.15      # +15% к выручке
    "ngvkseller.multiplier.premium": 1.30  # +30% к выручке

  # Звуковое сопровождение
  sounds:
    enabled: true
    sell-success: "ENTITY_EXPERIENCE_ORB_PICKUP"
    sell-failure: "ENTITY_VILLAGER_NO"
    click: "UI_BUTTON_CLICK"

# Настройки всех текстовых сообщений
messages:
  no-permission: "#ff5555У вас нет прав для выполнения этой команды!"
  only-players: "#ff5555Эту команду могут использовать только игроки."
  sold-items: "#2ecc71Вы успешно продали #e8d399%amount% шт. %item% #2ecc71на сумму #e8d399$%price%!"
  nothing-to-sell: "#ff5555У вас нет подходящих предметов для продажи!"
  limit-reached: "#ff5555Вы достигли дневного лимита продаж! Лимит: #e8d399$%limit% / $%max_limit%"
  limit-partially-reached: "#e67e22Продана только часть предметов на сумму #e8d399$%price%#e67e22 (достигнут дневной лимит)!"
  limit-reset-player: "#2ecc71Дневной лимит для игрока #e8d399%player% #2ecc71успешно сброшен."
  reload: "#2ecc71Конфигурация плагина успешно перезагружена."
  stats-info: "#e8d399Статистика %player%: #2ecc71Заработано сегодня: $%today% / $%max% | Всего: $%total%"
  invalid-player: "#ff5555Игрок не найден!"