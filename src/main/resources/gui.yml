# Доступные действия (action):
# SELL - продать конкретный предмет из 'item-type'
# SELL_ALL - продать абсолютно все подходящие ресурсы из инвентаря
# STATS - показать личную статистику продаж
# NEXT_PAGE / PREV_PAGE - навигация
# NONE - декоративный элемент

pages:
