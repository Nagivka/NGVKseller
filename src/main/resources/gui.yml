    title: "#e8d399Скупщик | Главное меню"
    size: 54
    filler:
      enabled: true
      material: "GRAY_STAINED_GLASS_PANE"
      name: " "
    items:
      10:
        material: DIAMOND
        name: "#e8d399Продать Алмазы"
        lore:
          - "#7f8c8dБазовая цена: #2ecc71$150 / шт."
          - "#7f8c8dТекущий курс: #e8d399%rate%%"
